# StackHost configuration file
# Version: 2.0.0

user:
  name: Alex Stack           # 您的平台用户名
  github: jpus    # 您的 GitHub 用户名

runtime:
  image: python:3.11-slim                # 推荐使用 Node.js LTS 版本（如 node:20 或 node:22-slim）

commands:
  package: ""                   # 如果不需要额外的系统级 apt 软件库，留空或不写即可
  build:
    - pip install --no-cache-dir -r requirements.txt                    # npm ci 生产环境安装依赖（比 npm install 更稳定干净）
  start: "python app.py"            # 或者写 "node app.js" / "node index.js"

repository:
  branch: main                  # 要部署的代码分支
  auto_deploy: true             # 是否开启代码 Push 后自动触发部署

